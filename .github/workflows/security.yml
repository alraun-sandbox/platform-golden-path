name: Reusable · Security

# The shift-left gate. Every service inherits it; no service implements it.
#
# Design note - why this runs CodeQL rather than relying on default setup:
# default setup gives a zero-effort baseline but cannot run *our* queries. The PII-in-logs rule
# that catches the Act 3 defect is a Zurich compliance rule, not a stock CodeQL rule, so the
# estate uses advanced setup with the shared query pack from this repository. Uniform across
# every repo, and it encodes our regulations rather than someone else's defaults.

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language - csharp, java, javascript-typescript, actions.
        required: true
        type: string
      build-mode:
        description: none | autobuild | manual
        required: false
        type: string
        default: 'none'
      build-command:
        description: >
          Build command for build-mode: manual. Ignored otherwise. Required when
          build-mode is manual - CodeQL observes a compiler doing real work, so
          something has to run between init and analyze.
        required: false
        type: string
        default: ''
      project-path:
        required: false
        type: string
        default: '.'
      fail-on-severity:
        description: Dependency review threshold - low | moderate | high | critical.
        required: false
        type: string
        default: 'high'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # SAST - including the custom compliance queries
  # ---------------------------------------------------------------------------
  codeql:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # NOTE ON VISIBILITY - this step is why platform-golden-path is not private.
      #
      # A workflow's GITHUB_TOKEN is scoped to the repository it runs in. Being in the same
      # organisation grants it nothing. So a private central repository can be *called* as a
      # reusable workflow (Actions arranges that separately) while being unreadable to the very
      # workflow it is running - which is exactly what happened here: the estate's security scans
      # failed with "Not Found - .../get-a-repository", because GitHub returns 404 rather than 403
      # for things you may not know exist. The error names no repository and suggests no cause.
      #
      # Three ways out: make this repository readable by its consumers, hand every consumer a
      # token, or publish the queries as a CodeQL pack to a registry. Handing out tokens to read
      # your own standards is the worst of the three - it puts a credential in ten repositories
      # to distribute a file with no secrets in it.
      - name: Fetch shared compliance queries
        uses: actions/checkout@v4
        with:
          repository: alraun-sandbox/platform-golden-path
          path: .platform
          sparse-checkout: codeql
          sparse-checkout-cone-mode: false

      # The compliance pack is per-language. Where we have written rules for a language they
      # are added to the stock suite; where we have not, the stock suite still runs.
      - name: Resolve query pack
        id: queries
        shell: bash
        run: |
          # The './' prefix is load-bearing. CodeQL's 'queries' value is either a local path or
          # an external specifier 'owner/repo/path@ref', and it decides which by looking for a
          # leading './'. Without it, '.platform/codeql/queries/java' is parsed as a repository
          # and the run dies with "Specifier for external repository is invalid" - which does not
          # mention paths at all, so the obvious reading is that the pack is missing.
          pack="./.platform/codeql/queries/${{ inputs.language }}"
          if [ -d "$pack" ]; then
            echo "Using Zurich compliance pack: ${pack}"
            echo "value=security-extended,${pack}" >> "$GITHUB_OUTPUT"
          else
            echo "No Zurich compliance pack for ${{ inputs.language }} - stock suite only."
            echo "value=security-extended" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ steps.queries.outputs.value }}
          config: |
            paths-ignore:
              - '**/bin/**'
              - '**/obj/**'
              - '**/node_modules/**'
              - '**/dist/**'

      # build-mode: manual means CodeQL watches a real compilation. Without a
      # build here, init succeeds, analyze finds no compiler traces and the scan
      # reports zero results - a green check on an unscanned repository, which
      # is the worst possible outcome of a security workflow.
      - name: Guard manual build mode
        if: inputs.build-mode == 'manual' && inputs.build-command == ''
        shell: bash
        run: |
          echo "::error::build-mode 'manual' requires a build-command input." >&2
          exit 1

      - name: Set up JDK (manual Java builds)
        if: inputs.build-mode == 'manual' && inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (manual mode)
        if: inputs.build-mode == 'manual'
        working-directory: ${{ inputs.project-path }}
        shell: bash
        run: ${{ inputs.build-command }}

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ inputs.language }}

  # ---------------------------------------------------------------------------
  # Supply chain - blocks the pull request, not the release
  # ---------------------------------------------------------------------------
  dependency-review:
    name: dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          # Copyleft licences are a legal risk in a commercial insurance product.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------------
  # Container supply chain - the image the pipeline is about to build
  # ---------------------------------------------------------------------------
  # The Rego bundle for this lived in the golden path for a while without any
  # workflow calling it. A policy nobody runs is documentation, and documentation
  # does not block anything, so it runs here where every service inherits it.
  container-policy:
    name: container-policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out the policy bundle
        uses: actions/checkout@v4
        with:
          repository: alraun-sandbox/platform-golden-path
          ref: v1
          path: .platform

      - name: Find Dockerfiles
        id: find
        shell: bash
        run: |
          set -euo pipefail
          # Repository Dockerfiles only. Exclude the policy bundle we just checked
          # out, whose fixtures are deliberately non-compliant, and any vendored or
          # build output directories.
          mapfile -t files < <(
            find . -type f \( -name Dockerfile -o -name 'Dockerfile.*' \) \
              -not -path './.platform/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/.terraform/*' \
              -not -path '*/obj/*' -not -path '*/bin/*' \
              | sort
          )
          printf 'Found %d Dockerfile(s).\n' "${#files[@]}"
          printf '  %s\n' "${files[@]:-}"
          echo "files=${files[*]:-}" >> "$GITHUB_OUTPUT"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

      - name: Evaluate container policy
        if: steps.find.outputs.count != '0'
        uses: alraun-sandbox/platform-golden-path/actions/policy-check@v1
        with:
          files: ${{ steps.find.outputs.files }}
          parser: dockerfile
          policy-path: .platform/policy/container
          title: Container policy

  # ---------------------------------------------------------------------------
  # Evidence - so the gate result is legible to a human, not just to a bot
  # ---------------------------------------------------------------------------
  summary:
    name: security-summary
    runs-on: ubuntu-latest
    needs: [codeql, dependency-review, container-policy]
    if: always()

    steps:
      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Security gate"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| CodeQL (security-extended + Zurich compliance pack) | ${{ needs.codeql.result }} |"
            echo "| Dependency review (fail-on: ${{ inputs.fail-on-severity }}) | ${{ needs.dependency-review.result }} |"
            echo "| Container policy (ZUR-SUP-006) | ${{ needs.container-policy.result }} |"
            echo ""
            echo "Secret scanning and push protection are enforced by the organisation"
            echo "security configuration, before code ever reaches this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any gate failed
        if: >-
          needs.codeql.result == 'failure' ||
          needs.dependency-review.result == 'failure' ||
          needs.container-policy.result == 'failure'
        run: exit 1
