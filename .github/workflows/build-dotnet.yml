name: Reusable · .NET build & test

# The paved road for every .NET service in the estate.
#
# A service repository consumes this in three lines. It does not own build logic, it does not
# own the security wiring, and it cannot silently drift from the standard - the moment
# platform-engineering changes this file, every service inherits the change.

on:
  workflow_call:
    inputs:
      project-path:
        description: >-
          Path to the solution or project to restore, build and test. Passed as an argument to
          the dotnet CLI, so a .sln or .csproj is expected - not a directory to run inside.
        required: false
        type: string
        default: '.'
      publish-project:
        description: >-
          Optional path to a single project to `dotnet publish` as a build artifact. Must be one
          project, never a solution: `dotnet publish --output` against a solution fails with
          NETSDK1194. Leave empty when the deployable is a container built from a Dockerfile,
          which is the normal case here - then no artifact is produced and nothing is wasted.
        required: false
        type: string
        default: ''
      dotnet-version:
        description: .NET SDK version.
        required: false
        type: string
        default: '8.0.x'
      run-tests:
        required: false
        type: boolean
        default: true
      coverage-threshold:
        description: Minimum line coverage percentage. The build fails below this.
        required: false
        type: number
        default: 40
    outputs:
      version:
        description: Version produced for this build.
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        shell: bash
        run: echo "value=1.0.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "${{ inputs.project-path }}"

      - name: Build
        run: dotnet build "${{ inputs.project-path }}" --no-restore --configuration Release

      - name: Test
        if: inputs.run-tests
        run: |
          dotnet test "${{ inputs.project-path }}" --no-build --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Enforce coverage threshold
        if: inputs.run-tests
        shell: bash
        run: |
          set -euo pipefail

          # This used to be `find ... | head -n 1` plus a grep for the first line-rate
          # attribute. Three things were wrong, and each was invisible while the pipeline
          # was failing earlier for other reasons:
          #
          #   1. A solution with several test projects produces several cobertura reports.
          #      Taking the first one that `find` happens to return measured one arbitrary
          #      test project and called it the coverage of the repository. Adding a small,
          #      well-tested project could push the number up while the codebase got worse.
          #   2. When the grep found nothing, `rate` was empty, and the arithmetic became
          #      `printf "%.1f",  * 100` - an awk syntax error. The step exited 2 with no
          #      message, which reads like infrastructure flakiness rather than a broken
          #      quality gate.
          #   3. Summing lines-covered and lines-valid across reports looked like the
          #      obvious fix and was still wrong. Cobertura reports overlap: two test
          #      projects that both reference the API project each report every line of it,
          #      so the same source line is counted once per report. The denominator then
          #      grows with the number of test projects rather than with the size of the
          #      codebase. Adding a unit-test project to riskguardian-claims moved the
          #      reported figure from 67.3% to 48.8% without touching a line of production
          #      code, and the build failed for a drop that had not happened.
          #
          # Take the union instead. A line is covered if any report saw it hit, and the
          # denominator is the number of distinct lines anyone measured. That is what a
          # coverage merge tool does, it is the only aggregation a developer can act on,
          # and it makes duplicate reports harmless by construction.
          mapfile -t reports < <(find . -name 'coverage.cobertura.xml' -not -path './.git/*')

          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No coverage report was produced. The threshold check cannot pass by default - if this project genuinely has no tests, set run-tests: false explicitly."
            exit 1
          fi

          echo "Found ${#reports[@]} coverage report(s)."

          pct=$(python3 - "${reports[@]}" <<'PY'
          import hashlib, sys, xml.etree.ElementTree as ET

          # VSTest writes each cobertura report twice: once under TestResults/<guid>/ and again
          # as an attachment copy under TestResults/_<machine>_<timestamp>/In/<machine>/. Both
          # are found by the search. The union below would absorb the repeat anyway; dedupe by
          # content so the per-report diagnostic listing stays readable.
          seen = set()
          lines = {}
          for path in sys.argv[1:]:
              digest = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              if digest in seen:
                  print(f"  (duplicate)   {path}", file=sys.stderr)
                  continue
              seen.add(digest)

              root = ET.parse(path).getroot()
              c = int(root.get('lines-covered', 0))
              v = int(root.get('lines-valid', 0))
              rate = (100.0 * c / v) if v else 0.0
              print(f"  {rate:5.1f}%  {c:>6}/{v:<6}  {path}", file=sys.stderr)

              for cls in root.iter('class'):
                  filename = cls.get('filename')
                  for line in cls.iter('line'):
                      key = (filename, line.get('number'))
                      lines[key] = lines.get(key, False) or int(line.get('hits', 0)) > 0

          if not lines:
              print("  no measurable lines in any report", file=sys.stderr)
              sys.exit(3)

          covered = sum(1 for hit in lines.values() if hit)
          print(f"  union         {covered:>6}/{len(lines):<6}", file=sys.stderr)
          print(f"{100.0 * covered / len(lines):.1f}")
          PY
          )

          echo "Total line coverage: ${pct}% (threshold ${{ inputs.coverage-threshold }}%)"

          {
            echo "### Coverage"
            echo ""
            echo "Total line coverage **${pct}%** against a threshold of ${{ inputs.coverage-threshold }}%, aggregated over ${#reports[@]} report(s)."
          } >> "$GITHUB_STEP_SUMMARY"

          awk "BEGIN { exit !($pct >= ${{ inputs.coverage-threshold }}) }" || {
            echo "::error::Coverage ${pct}% is below the required ${{ inputs.coverage-threshold }}%."
            exit 1
          }

      - name: Publish test results
        if: always() && inputs.run-tests
        uses: actions/upload-artifact@v4
        with:
          name: test-results-dotnet
          path: '**/TestResults/**'
          retention-days: 7
          if-no-files-found: ignore

      - name: Package
        if: inputs.publish-project != ''
        run: |
          dotnet publish "${{ inputs.publish-project }}" \
            --no-build --configuration Release --output ./publish

      - uses: actions/upload-artifact@v4
        if: inputs.publish-project != ''
        with:
          name: app-dotnet
          path: ./publish
          retention-days: 7
