name: Azure OIDC login
description: >
  Exchange the workflow's short-lived OIDC token for Azure credentials. No client secret is
  stored anywhere in the organisation - the trust is a federated credential pinned to a
  specific repository, branch or environment.

inputs:
  client-id:
    description: Application (client) ID of the federated identity.
    required: true
  tenant-id:
    required: true
  subscription-id:
    required: true
  allow-no-subscriptions:
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Azure login (workload identity federation)
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        allow-no-subscriptions: ${{ inputs.allow-no-subscriptions }}

    - name: Confirm the identity we actually got
      shell: bash
      run: |
        set -euo pipefail
        # Deliberately visible in the log. Least privilege is only credible if you can see
        # which identity ran, and that it holds Contributor on one resource group - not Owner
        # on a subscription.
        az account show --query "{subscription:name, id:id, tenant:tenantId}" -o table
