name: Policy check
description: >
  Evaluate a file against the organisation's Rego policy bundle and render the verdict as
  reviewable markdown. Works on a Terraform plan JSON or, with `parser`, on any format
  Conftest understands (Dockerfile, YAML, HCL). Denials fail the step; warnings do not.

inputs:
  plan-json:
    description: Path to `terraform show -json` output. Shorthand for `files`.
    required: false
    default: ''
  files:
    description: >
      Space-separated paths to evaluate. Takes precedence over `plan-json`. Use with `parser`
      for non-JSON inputs.
    required: false
    default: ''
  parser:
    description: >
      Conftest parser to force, e.g. `dockerfile`. Leave empty to let Conftest infer it from
      the file extension, which is what a plan JSON wants.
    required: false
    default: ''
  title:
    description: Heading used for the job summary section.
    required: false
    default: Policy as code
  policy-path:
    description: Directory containing the Rego policies.
    required: false
    default: policy/terraform
  conftest-version:
    required: false
    default: '0.56.0'
  fail-on-warn:
    required: false
    default: 'false'

outputs:
  summary:
    description: Markdown summary of the policy verdict, for a pull request comment.
    value: ${{ steps.evaluate.outputs.summary }}
  violations:
    description: Number of denials.
    value: ${{ steps.evaluate.outputs.violations }}

runs:
  using: composite
  steps:
    - name: Install Conftest
      shell: bash
      run: |
        set -euo pipefail
        v="${{ inputs.conftest-version }}"
        curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${v}/conftest_${v}_Linux_x86_64.tar.gz" \
          | tar -xz -C /tmp conftest
        /tmp/conftest --version

    - name: Evaluate policies
      id: evaluate
      env:
        TARGETS: ${{ inputs.files != '' && inputs.files || inputs.plan-json }}
        PARSER: ${{ inputs.parser }}
      shell: bash
      run: |
        set -uo pipefail

        if [ -z "${TARGETS// /}" ]; then
          echo "::error::policy-check needs either files or plan-json."
          exit 1
        fi

        args=(--policy "${{ inputs.policy-path }}" --output json --all-namespaces)
        if [ -n "$PARSER" ]; then
          args+=(--parser "$PARSER")
        fi

        # TARGETS is deliberately unquoted: it may name several files.
        # shellcheck disable=SC2086
        /tmp/conftest test "${args[@]}" $TARGETS > result.json || true

        fails=$(jq '[.[].failures[]?] | length' result.json)
        warns=$(jq '[.[].warnings[]?] | length' result.json)
        echo "violations=${fails}" >> "$GITHUB_OUTPUT"

        {
          if [ "$fails" -eq 0 ] && [ "$warns" -eq 0 ]; then
            echo "**PASS** — all organisation policies satisfied."
          else
            echo "| | Policy | Finding |"
            echo "|---|--------|---------|"
            jq -r '.[].failures[]? | "| DENY | \(.metadata.policy // "policy") | \(.msg) |"' result.json
            jq -r '.[].warnings[]? | "| WARN | \(.metadata.policy // "policy") | \(.msg) |"' result.json
            echo ""
            echo "_${fails} denial(s), ${warns} warning(s). Denials block the merge; warnings do not._"
          fi
        } > summary.md

        {
          echo 'summary<<POLICY_EOF'
          cat summary.md
          echo 'POLICY_EOF'
        } >> "$GITHUB_OUTPUT"

        {
          echo "## ${{ inputs.title }}"
          echo ""
          cat summary.md
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$fails" -gt 0 ]; then
          echo "::error::${fails} policy violation(s). See the job summary."
          exit 1
        fi
        if [ "${{ inputs.fail-on-warn }}" = "true" ] && [ "$warns" -gt 0 ]; then
          echo "::error::${warns} policy warning(s) with fail-on-warn enabled."
          exit 1
        fi
        exit 0
